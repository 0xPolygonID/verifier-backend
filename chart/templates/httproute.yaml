apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  parentRefs:
    - name: main
      namespace: infra
  hostnames:
    {{- range .Values.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "verifier-backend.fullname" . }}
          port: {{ .Values.service.port }}
